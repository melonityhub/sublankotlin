name: Build and Release SubX Player

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Ensure Android SDK exists (fallback)
        if: always()
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_SDK_ROOT" ]; then export ANDROID_SDK_ROOT=$ANDROID_HOME; fi
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME=$ANDROID_SDK_ROOT; fi
          echo "SDK at $ANDROID_HOME"
          ls -la $ANDROID_HOME 2>&1 | head -30
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper..."
            GRADLE_VERSION=8.7
            mkdir -p gradle/wrapper
            curl -sL --retry 3 https://github.com/gradle/gradle/raw/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar && echo "Downloaded wrapper jar" || echo "download failed"
            ls -lh gradle/wrapper/ || true
          fi
          chmod +x gradlew || true
          ls -lh gradlew gradle/wrapper/ || true
          ./gradlew --version || true

      - name: Validate project
        run: |
          echo "Checking project structure..."
          ls -R app/src/main | head -100
          cat app/build.gradle.kts | head -60
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK (with log capture)
        run: |
          set +e
          ./gradlew assembleDebug --stacktrace --warning-mode all 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          echo "Gradle exit code: $EXIT"
          mkdir -p app/build/outputs/logs
          cp /tmp/build.log app/build/outputs/logs/build.log || true
          echo "---- last 500 lines of build.log ----"
          tail -n 500 /tmp/build.log || true
          if [ $EXIT -ne 0 ]; then
            echo "Build failed, see log above"
            # also show first error
            grep -i "error" /tmp/build.log | head -100 || true
            exit $EXIT
          fi

      - name: Build Release APK
        if: success()
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Run Lint
        if: success()
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SubX-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.1-${{ github.run_number }}
          name: SubX Player v2.3.1 Build ${{ github.run_number }}
          body: |
            Automated build of SubX Video Player (Kotlin port).
            - Faithful replica of original Flutter app
            - All screens, features, and endpoints
            - Configurable secrets in Settings > Advanced > Secrets
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/build.log
            app/build/outputs/logs/
            app/build/reports/
          if-no-files-found: warn
