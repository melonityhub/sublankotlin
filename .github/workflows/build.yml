name: Build and Release SubX Player

on:
  push:
    branches: [ main, arena/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true
        with:
          api-level: 36
          build-tools: 36.0.0

      - name: Ensure Android SDK exists (fallback)
        if: always()
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          if [ -z "$ANDROID_SDK_ROOT" ]; then export ANDROID_SDK_ROOT=$ANDROID_HOME; fi
          if [ -z "$ANDROID_HOME" ]; then export ANDROID_HOME=$ANDROID_SDK_ROOT; fi
          echo "SDK at $ANDROID_HOME"
          ls -la $ANDROID_HOME 2>&1 | head -30
          # Accept licenses
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
          # Also try 34 as fallback
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating wrapper..."
            # Try to download wrapper jar from gradle distribution
            GRADLE_VERSION=8.7
            mkdir -p gradle/wrapper
            curl -sL --retry 3 https://github.com/gradle/gradle/raw/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar && echo "Downloaded wrapper jar" || echo "download failed, will try gradle wrapper task"
            ls -lh gradle/wrapper/ || true
            if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
              # Fallback: generate via gradle init if gradle available
              echo "Attempting to generate wrapper via gradle..."
              if command -v gradle >/dev/null 2>&1; then
                gradle wrapper --gradle-version $GRADLE_VERSION || true
              fi
            fi
          fi
          chmod +x gradlew || true
          ls -lh gradlew gradle/wrapper/ || true

      - name: Validate project
        run: |
          echo "Checking project structure..."
          ls -R app/src/main | head -100
          cat app/build.gradle.kts | head -40
          echo "--- gradle wrapper check ---"
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode all
        continue-on-error: false

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace
        continue-on-error: true

      - name: Run Lint
        run: ./gradlew lint --stacktrace
        continue-on-error: true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SubX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SubX-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.1-${{ github.run_number }}
          name: SubX Player v2.3.1 Build ${{ github.run_number }}
          body: |
            Automated build of SubX Video Player (Kotlin port).
            - Faithful replica of original Flutter app
            - All screens, features, and endpoints
            - Configurable secrets in Settings > Advanced > Secrets
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
